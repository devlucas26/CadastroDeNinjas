<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Ninja</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <style>
    body {
        background-color: #f8f9fa;
    }
    .container {
        margin-top: 50px;
        background-color: #ffffff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
<div class="container">
  <h1 class="mb-4">Editar Ninja</h1>

  <!-- O objeto 'ninja' será preenchido com os dados do ninja existente -->
  <form th:action="@{/ninja/ui/atualizar}" th:object="${ninja}" method="post">
    <!-- Campo oculto para o ID do ninja, necessário para a atualização -->
    <input type="hidden" th:field="*{id}" />

    <div class="form-group">
      <label for="nome">Nome:</label>
      <input type="text" class="form-control" id="nome" th:field="*{nome}" required>
    </div>
    <div class="form-group">
      <label for="email">Email:</label>
      <input type="email" class="form-control" id="email" th:field="*{email}" required>
    </div>
    <div class="form-group">
      <label for="idade">Idade:</label>
      <input type="number" class="form-control" id="idade" th:field="*{idade}" required>
    </div>
    <div class="form-group">
      <label for="url_img">URL da Imagem:</label>
      <input type="url" class="form-control" id="url_img" th:field="*{url_img}">
    </div>
    <div class="form-group">
      <label for="ninjaRank">Rank Ninja:</label>
      <input type="text" class="form-control" id="ninjaRank" th:field="*{ninjaRank}" required>
    </div>
    <!-- O campo 'missoes' (MissoesModel) geralmente não é preenchido diretamente em um formulário de edição simples.
         Se você precisar associar/desassociar missões a um ninja, a lógica seria mais complexa (ex: múltiplos selects, etc.).
         Por enquanto, vamos omitir a entrada direta para 'missoes'. -->

    <button type="submit" class="btn btn-primary">Atualizar Ninja</button>
    <a th:href="@{/ninja/ui/listar}" class="btn btn-secondary">Cancelar</a>
  </form>
</div>
</body>
</html>
