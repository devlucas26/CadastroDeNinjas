<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Missão</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            margin-top: 50px;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
<div class="container">
    <h1 class="mb-4">Editar Missão</h1>

    <!-- O objeto 'missao' será preenchido com os dados da missão existente -->
    <form th:action="@{/missoes/ui/atualizar}" th:object="${missao}" method="post">
        <!-- Campo oculto para o ID da missão, necessário para a atualização -->
        <input type="hidden" th:field="*{id}" />

        <div class="form-group">
            <label for="nomeDaMissao">Nome da Missão:</label>
            <input type="text" class="form-control" id="nomeDaMissao" th:field="*{nomeDaMissao}" required>
        </div>
        <div class="form-group">
            <label for="dificuldade">Dificuldade:</label>
            <input type="text" class="form-control" id="dificuldade" th:field="*{dificuldade}" required>
        </div>

        <button type="submit" class="btn btn-primary">Atualizar Missão</button>
        <a th:href="@{/missoes/ui/listar}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
